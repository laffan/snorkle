[package]
name = "snorkle-content"
description = "Hosts untrusted web content: one WKWebView per live tab, created and driven from Rust via objc2. Has no IPC path to the app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
snorkle-core.workspace = true
url.workspace = true

# Versions pinned to exactly what wry 0.57.1 (via tauri-runtime-wry 2.12.3)
# resolves, so a single copy of each objc2 crate is linked.
[target.'cfg(target_os = "ios")'.dependencies]
# `exception`: already enabled by wry; used to keep a menu-building
# exception from terminating the app (ios/menu.rs).
objc2 = { version = "=0.6.5", features = ["exception"] }
block2 = "=0.6.2"
objc2-core-foundation = { version = "=0.3.2", features = ["std", "CFCGTypes", "CFDictionary", "CFData", "CFString", "CFNumber"] }
objc2-security = { version = "=0.3.2", default-features = false, features = ["std", "SecBase", "SecItem"] }
objc2-foundation = { version = "=0.3.2", features = [
  "std", "block2", "objc2-core-foundation",
  "NSArray", "NSDate", "NSDictionary", "NSError", "NSKeyValueObserving", "NSNotification",
  "NSObject", "NSOperation", "NSProcessInfo", "NSSet", "NSString", "NSURL", "NSURLRequest",
  "NSURLAuthenticationChallenge", "NSURLCredential", "NSURLSession", "NSURLRequest", "NSURLResponse", "NSUUID", "NSValue", "NSData",
] }
# Cutting the floating URL pill out of content views (layer mask).
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGPath"] }
objc2-ui-kit = { version = "=0.3.2", features = [
  "std", "objc2-core-foundation", "objc2-quartz-core", "objc2-core-graphics", "UIBezierPath", "UIGeometry", "UIApplication", "UIResponder", "UIView", "UIScrollView",
  "UIGestureRecognizer", "UITapGestureRecognizer", "UIKeyCommand", "UICommand", "UIMenuElement", "UIMenu",
  "UIMenuBuilder", "UIMenuSystem", "UIControl", "UIRefreshControl",
  "UIImage", "UIColor", "UIGraphicsRenderer", "UIGraphicsImageRenderer",
] }
objc2-web-kit = { version = "=0.3.2", features = [
  "std", "block2", "objc2-core-foundation",
  "WKContentRuleList", "WKContentRuleListStore", "WKFrameInfo", "WKNavigation",
  "WKFindConfiguration", "WKFindResult", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKPreferences",
  "WKSecurityOrigin", "WKUIDelegate", "WKUserContentController", "WKWebViewConfiguration",
  "WKUserScript", "WKContentWorld", "WKScriptMessage", "WKScriptMessageHandler", "WKWebsiteDataRecord", "WKSnapshotConfiguration",
  "WKWebsiteDataStore", "WKWindowFeatures", "WKWebpagePreferences",
] }
