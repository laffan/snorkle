[package]
name = "snorkle-content"
description = "Hosts untrusted web content: one WKWebView per live tab, created and driven from Rust via objc2. Has no IPC path to the app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
snorkle-core.workspace = true
url.workspace = true

# Versions pinned to exactly what wry 0.57.1 (via tauri-runtime-wry 2.12.3)
# resolves, so a single copy of each objc2 crate is linked.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-core-foundation = { version = "=0.3.2", features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "=0.3.2", features = [
  "std", "block2", "objc2-core-foundation",
  "NSArray", "NSDate", "NSDictionary", "NSError", "NSKeyValueObserving", "NSNotification",
  "NSObject", "NSOperation", "NSProcessInfo", "NSSet", "NSString", "NSURL", "NSURLRequest",
  "NSURLAuthenticationChallenge", "NSURLCredential", "NSURLSession", "NSUUID", "NSValue",
] }
objc2-ui-kit = { version = "=0.3.2", features = [
  "std", "objc2-core-foundation", "UIApplication", "UIResponder", "UIView", "UIScrollView",
] }
objc2-web-kit = { version = "=0.3.2", features = [
  "std", "block2", "objc2-core-foundation",
  "WKContentRuleList", "WKContentRuleListStore", "WKFrameInfo", "WKNavigation",
  "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKPreferences",
  "WKSecurityOrigin", "WKUIDelegate", "WKUserContentController", "WKWebViewConfiguration",
  "WKWebsiteDataStore", "WKWindowFeatures", "WKWebpagePreferences",
] }
