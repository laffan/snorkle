[package]
name = "snorkle"
description = "iPad-first web browser: Tauri v2 chrome + system WKWebView content."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "snorkle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false , features = [] }

[dependencies]
snorkle-core.workspace = true
snorkle-content.workspace = true
serde.workspace = true
serde_json.workspace = true
# default-features off: drops `dynamic-acl` (runtime capability changes)
# and the desktop-only x11/dbus/common-controls features.
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression"] }
raw-window-handle = "=0.6.2"

[dev-dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "test"] }
